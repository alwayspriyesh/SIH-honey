name: Build Android APK (No Local Android Studio Needed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble Debug APK in Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Next.js & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Honey Chain Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: honey-chain-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
